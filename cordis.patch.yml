# dsh-talk (android) bundle patch: MiniMax cloud TTS, played by the Web UI.
#
# The Android runtime has no local TTS engine and no host audio player, so this
# branch keeps exactly one engine: MiniMax speech-2.8-turbo. The host synthesizes
# the MP3 and queues it; the DeepSeek Harness Web UI drains the queue and plays
# it in the WebView. The composer shows an auto/manual mode button and a
# play/stop button.
- insert:
    - id: talk
      name: dsh-talk
      config:
        tts:
          minimax:
            # API key resolution: this environment variable first, then the
            # harness credential store's refs section. Never logged.
            apiKeyEnv: MINIMAX_CN_API_KEY
            # Harness credential store fallback; empty = do not read a file.
            credentialsFile: ~/.dsh/.credentials.yaml
            # Synchronous T2A endpoint (api-bj.minimaxi.com is lower latency in
            # northern China).
            baseUrl: https://api.minimax.cn/v1/t2a_v2
            # speech-2.8-turbo (fastest) or speech-2.8-hd (more expressive).
            model: speech-2.8-turbo
            # System voice id, e.g. "Chinese (Mandarin)_Warm_Girl",
            # "female-yujie", "Chinese (Mandarin)_Gentleman".
            voiceId: Chinese (Mandarin)_Warm_Girl
            # Characters per API request; longer text splits at sentence
            # boundaries and the pieces are concatenated into one utterance.
            chunkChars: 2000
            # Idle timeout: no network progress for this long fails the utterance
            # (5000..600000).
            requestTimeoutMs: 120000
        # Speak "Turn complete." when a turn was not auto-read and nothing plays.
        announce:
          enabled: true
        # Automatic read-aloud of the assistant's final reply. The composer
        # mode button overrides this at runtime (auto = read every reply,
        # manual = only the play button speaks); a restart returns here.
        autoReply:
          enabled: true
          # Cap on one spoken reply in characters (1..100000).
          maxChars: 600
        # Cap on the speak tool's text length in characters (1..100000).
        maxSpeakChars: 20000
